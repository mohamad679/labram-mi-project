name: Phase 2 — Real EEG data and preprocessing audit

on:
  pull_request:
    paths:
      - "src/eeg_protocol.py"
      - "src/data.py"
      - "src/channels.py"
      - "src/portable_eeg.py"
      - "scripts/audit_phase2_data.py"
      - "scripts/stage_phase1_eeg.py"
      - "scripts/prepare_physionet_s3.py"
      - "tests/test_phase2_protocol.py"
      - ".github/workflows/phase2-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-public-eeg-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MNE_DATA: /tmp/mne_data
      MNE_DATASETS_EEGBCI_PATH: /tmp/mne_data
      MOABB_DOWNLOAD_PROVIDER: upstream
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned preprocessing stack and test runner
        run: >-
          python -m pip install
          "moabb==1.7.2" "mne==1.13.2" "numpy>=1.24,<3"
          "h5py>=3.10,<5" "boto3>=1.34,<2" "pytest>=8,<9"
      - name: Run independent protocol negative controls
        run: python -m pytest -q tests/test_phase2_protocol.py
      - name: Stage two real public participants, imagery-only EDF runs
        run: >-
          python -m scripts.stage_phase1_eeg
          --mne-root "$MNE_DATA"
          --output artifacts/phase2/s3_stage.json
      - name: Audit raw annotations, epoch window, class labels, and HDF5 parity
        run: >-
          python -m scripts.audit_phase2_data
          --mne-root "$MNE_DATA"
          --output artifacts/phase2/data_contract.json
      - name: Retain aggregate scientific audit only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-eeg-data-contract
          path: artifacts/phase2/*.json
          retention-days: 30
          if-no-files-found: error
