name: EEG preprocessing equivalence (public subject)
on:
  pull_request:
    paths:
      - "src/data.py"
      - "scripts/audit_moabb_equivalence.py"
      - ".github/workflows/eeg-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moabb-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MNE_DATA: /tmp/mne_data
      MNE_DATASETS_EEGBCI_PATH: /tmp/mne_data
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MOABB and MNE pipeline
        run: python -m pip install "moabb>=1.1,<2" "numpy>=1.24,<3"
      - name: Compare both processing routes for one public subject
        run: python -m scripts.audit_moabb_equivalence --subject 1 --output artifacts/moabb-equivalence.json
      - name: Save aggregate audit only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moabb-equivalence
          path: artifacts/moabb-equivalence.json
