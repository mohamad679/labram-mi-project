name: Phase 5.5b one-time Validation prerequisite smoke
on:
  pull_request:
    paths:
      - 'src/phase55b_protocol.py'
      - 'scripts/run_phase55b_validation.py'
      - 'tests/test_phase55b_protocol.py'
      - '.github/workflows/phase55b-train-eeg-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase55b-public-train-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MNE_DATA: /tmp/mne_data
      MNE_DATASETS_EEGBCI_PATH: /tmp/mne_data
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and genuine Train EEG dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1' 'torchaudio==2.5.1'
          python -m pip install 'braindecode==1.5.1' 'moabb==1.7.2' 'mne==1.13.2' 'boto3>=1.34,<2' 'pytest>=8,<9' 'h5py>=3.10,<5' 'scipy>=1.14,<2'
      - name: Reject held-out waveform access and alternate model nomination
        run: python -m pytest -q tests/test_phase55b_protocol.py
      - name: Confirm selected EEGNet normalized gradient on genuine public Train S003 EDF
        run: >-
          python -m scripts.phase55_real_train_smoke
          --mne-root "$MNE_DATA"
          --output artifacts/phase55b_selected_model_train_s003_smoke.json
      - name: Save Train-only smoke evidence (not a Validation experiment)
        uses: actions/upload-artifact@v4
        with:
          name: phase55b-public-train-only-S003
          path: artifacts/phase55b_selected_model_train_s003_smoke.json
          if-no-files-found: error
          retention-days: 30
