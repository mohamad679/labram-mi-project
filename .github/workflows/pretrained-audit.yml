name: Pretrained checkpoint audit (real Hub weights)
on:
  pull_request:
    paths:
      - "src/model.py"
      - "src/provenance.py"
      - "scripts/audit_pretrained.py"
      - ".github/workflows/pretrained-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-pretrained:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install Braindecode with Hugging Face integration
        run: python -m pip install "braindecode[hug]>=1.5,<2" "safetensors>=0.4,<1"
      - name: Audit exact official pretrained checkpoint
        run: |
          python -m scripts.audit_pretrained \
            --repo-id braindecode/labram-pretrained \
            --revision 0563b6c626e7b40d9a36653b763715db94d945d7 \
            --n-times 3000 \
            --output artifacts/pretrained-audit.json
      - name: Preserve provenance report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-labram-pretrained-audit
          path: artifacts/pretrained-audit.json
          retention-days: 30
