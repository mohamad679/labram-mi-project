name: Phase 5.5 real Train EEG CNN smoke
on:
  pull_request:
    paths:
      - 'src/phase55_trainonly.py'
      - 'scripts/run_phase55_trainonly_cv.py'
      - 'scripts/phase55_real_train_smoke.py'
      - 'tests/test_phase55_trainonly.py'
      - '.github/workflows/phase55-real-train-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase55-real-train-s003:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MNE_DATA: /tmp/mne_data
      MNE_DATASETS_EEGBCI_PATH: /tmp/mne_data
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install torch and Braindecode genuine EEG environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1' 'torchaudio==2.5.1'
          python -m pip install 'braindecode==1.5.1' 'moabb==1.7.2' 'mne==1.13.2' 'boto3>=1.34,<2' 'scipy>=1.14,<2' 'scikit-learn>=1.3,<2' 'h5py>=3.10,<5' 'pytest>=8,<9'
      - name: Offline Phase 5.5 guards
        run: python -m pytest -q tests/test_phase55_trainonly.py
      - name: One real public train subject S003 finite gradient pass for CNN candidates
        run: >-
          python -m scripts.phase55_real_train_smoke
          --mne-root /tmp/mne_data
          --output artifacts/phase55_train_s003_smoke.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phase55-public-train-only-s003
          path: artifacts/phase55_train_s003_smoke.json
          if-no-files-found: error
          retention-days: 30
