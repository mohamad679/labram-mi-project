name: Phase 4 — Public EEG pretrained gradient gate (CPU)

on:
  pull_request:
    paths:
      - "src/phase4_trainability.py"
      - "scripts/run_phase4_finetune.py"
      - "scripts/phase4_real_gradient_smoke.py"
      - "tests/test_phase4_trainability.py"
      - "tests/test_phase4_validation.py"
      - ".github/workflows/phase4-gradient-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-pretrained-backbone-gradient-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MNE_DATA: /tmp/mne_data
      MNE_DATASETS_EEGBCI_PATH: /tmp/mne_data
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MOABB_DOWNLOAD_PROVIDER: upstream
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and torchaudio
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1" "torchaudio==2.5.1"
      - name: Install pinned EEG public data stack
        run: python -m pip install "braindecode[hub]==1.5.1" "moabb==1.7.2" "mne==1.13.2" "boto3>=1.34,<2" "pytest>=8,<9"
      - name: Run trainability and experimental safety regression tests
        run: python -m pytest -q tests/test_phase4_trainability.py tests/test_phase4_validation.py
      - name: Stage two public EEG subjects from PhysioNet S3
        run: >-
          python -m scripts.stage_phase1_eeg
          --mne-root "$MNE_DATA"
          --output artifacts/phase4_s3_stage.json
      - name: Backprop through genuinely pretrained LaBraM on real public EEG
        run: >-
          python -m scripts.phase4_real_gradient_smoke
          --output artifacts/phase4_real_gradient_smoke.json
      - name: Preserve aggregate diagnostics without sharing raw EEG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-pretrained-gradient-evidence
          path: |
            artifacts/phase4_real_gradient_smoke.json
            artifacts/phase4_s3_stage.json
          retention-days: 30
          if-no-files-found: error
