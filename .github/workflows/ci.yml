name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.24,<3" "scikit-learn>=1.3,<2" "PyYAML>=6,<7" "pytest>=8,<9" "matplotlib>=3.8,<4" "ruff>=0.9,<1" "h5py>=3.10,<5" "requests>=2.28,<3" "pandas>=2,<3" "scipy>=1.14,<2"
      - name: Compile Python modules
        run: python -m compileall -q src scripts app.py tests
      - name: Lint configuration and data utilities
        run: ruff check src/portable_eeg.py scripts/prepare_portable_eeg.py scripts/prepare_physionet_s3.py src/artifact_integrity.py src/eeg_protocol.py src/training_modes.py scripts/phase1_real_eeg_acceptance.py scripts/stage_phase1_eeg.py scripts/audit_phase2_data.py scripts/run_phase3_validation.py scripts/run_phase4_finetune.py scripts/phase4_real_gradient_smoke.py scripts/phase5_pretrained_smoke.py scripts/run_phase5_cbramod.py src/phase4_trainability.py src/phase5_cbramod.py src/config.py src/data.py src/channels.py src/provenance.py src/subject_statistics.py scripts/subject_confidence.py scripts/run_multiseed.py scripts/real_eeg_train_smoke.py tests
      - name: Run offline unit tests
        run: python -m pytest -q
