name: Pretrained checkpoint smoke test (CPU)
on:
  pull_request:
    paths:
      - "src/model.py"
      - "scripts/audit_pretrained.py"
      - ".github/workflows/pretrained-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-hub-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch CPU-only
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1" "torchaudio==2.5.1"
      - name: Install pretrained model stack
        run: python -m pip install "braindecode[hub]==1.5.1" "safetensors>=0.4,<1"
      - name: Verify CPU wheels are matched
        run: python -c "import torch, torchaudio; print(torch.__version__, torchaudio.__version__, torch.cuda.is_available()); assert not torch.cuda.is_available()"
      - name: Audit immutable pretrained checkpoint at official configuration
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          OMP_NUM_THREADS: "2"
        run: >-
          python -m scripts.audit_pretrained
          --repo-id braindecode/labram-pretrained
          --revision 0563b6c626e7b40d9a36653b763715db94d945d7
          --n-times 3000
          --output artifacts/pretrained-audit.json
      - name: Audit pretrained model at actual 400-sample project input
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          OMP_NUM_THREADS: "2"
        run: >-
          python -m scripts.audit_pretrained
          --repo-id braindecode/labram-pretrained
          --revision 0563b6c626e7b40d9a36653b763715db94d945d7
          --n-times 400
          --output artifacts/pretrained-400-audit.json
      - name: Preserve verified report only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pretrained-audit
          path: artifacts/pretrained-*-audit.json
