name: Phase 5 CBraMod public pretrained smoke
on:
  pull_request:
    paths:
      - "src/phase5_cbramod.py"
      - "scripts/phase5_pretrained_smoke.py"
      - "scripts/run_phase5_cbramod.py"
      - "tests/test_phase5_cbramod.py"
      - ".github/workflows/phase5-pretrained-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pretrained-cbramod-train-subject-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MNE_DATA: /tmp/mne_data
      MNE_DATASETS_EEGBCI_PATH: /tmp/mne_data
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install aligned PyTorch CPU packages
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1" "torchaudio==2.5.1"
      - name: Install pinned research and safe model-loading stack
        run: >-
          python -m pip install "braindecode[hub]==1.5.1" "moabb==1.7.2"
          "mne==1.13.2" "scipy>=1.14,<2" "safetensors>=0.4,<1"
          "huggingface_hub>=0.30,<2" "boto3>=1.34,<2" "h5py>=3.10,<5"
      - name: Check source adapter and explicit bad-shape negative controls
        run: python -m pip install "pytest>=8,<9" && python -m pytest -q tests/test_phase5_cbramod.py
      - name: Load pinned public CBraMod and backprop on training participant 3
        run: >-
          python -m scripts.phase5_pretrained_smoke
          --mne-root "$MNE_DATA"
          --output artifacts/phase5_cbramod_train_eeg_smoke.json
      - name: Archive aggregate scientific smoke report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-cbramod-public-train-eeg-smoke
          path: artifacts/phase5_cbramod_train_eeg_smoke.json
          if-no-files-found: error
          retention-days: 30
