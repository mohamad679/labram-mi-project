name: Repository documentation and artifact integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Documentation links and tracked-file hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests for link parser and artifact policy
        run: |
          python -m pip install "pytest>=8,<9"
          python -m pytest -q tests/test_repository_quality.py
      - name: Audit tracked files and all internal Markdown links
        run: python -m scripts.check_repository_quality --repo-root .
